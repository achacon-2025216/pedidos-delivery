spring.application.name=pedidos-delivery

server.port=8080

# ---------- PostgreSQL (crear antes la BD "fastorder" en pgAdmin) ----------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/pedidos_delivery}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:admin}
spring.datasource.driver-class-name=org.postgresql.Driver

# ---------- JPA / Hibernate ----------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# ---------- Carga inicial (data.sql se ejecuta despues de crear las tablas) ----------
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8

# ---------- JWT ----------
jwt.secret=${JWT_SECRET:ZmFzdG9yZGVyLXN1cGVyLXNlY3JldC1rZXktcGFyYS1qd3QtaG1hYy1zaGEtMjU2LW1pbmltbyEhMTIzNDU2}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}